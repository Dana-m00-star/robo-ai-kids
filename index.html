<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>روبو يتعلم 🤖</title>

    <!-- الذكاء الاصطناعي -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            direction: rtl;
            background: linear-gradient(135deg, #dff7ff, #e9ddff);
            text-align: center;
        }

        .screen {
            min-height: 100vh;
            padding: 25px;
        }

        h1 {
            font-size: 42px;
            color: #333;
            margin: 10px;
        }

        .robot {
            font-size: 110px;
            margin: 5px;
            animation: float 2s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        .speech {
            background: white;
            display: inline-block;
            padding: 18px 30px;
            border-radius: 30px;
            font-size: 28px;
            margin: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            min-width: 250px;
        }

        button {
            border: none;
            background: #62d4a7;
            color: #123;
            padding: 18px 35px;
            border-radius: 25px;
            font-size: 24px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            transform: scale(1.05);
        }

        button:disabled {
            opacity: 0.6;
        }

        #camera {
            display: none;
            width: 90%;
            max-width: 750px;
            margin: 25px auto;
            border-radius: 30px;
            border: 7px solid white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        #result {
            font-size: 30px;
            font-weight: bold;
            margin-top: 10px;
        }

        .loading {
            font-size: 22px;
            margin: 10px;
        }

    </style>
</head>

<body>

<div class="screen">

    <h1>🤖 روبو يتعلّم!</h1>

    <div class="robot">
        🤖
    </div>

    <div class="speech" id="speech">
        هلاااا يا أصدقاء! 👋
    </div>

    <br>

    <button id="startButton" onclick="startRobot()">
        👀 شغّلوا عيوني!
    </button>

    <div class="loading" id="loading"></div>

    <video id="camera" autoplay playsinline></video>

    <div id="result"></div>

</div>


<script>

// ========================================
// المتغيرات
// ========================================

let model = null;

// الشيء الذي الروبوت قاله آخر مرة
let lastSpokenObject = "";

// الشيء الذي الروبوت يراقبه حاليًا
let currentObject = "";

// عدد المرات التي ظهر فيها نفس الشيء
let sameObjectCount = 0;

// لازم يظهر الشيء بهذا العدد من المرات قبل اعتماده
const REQUIRED_FRAMES = 8;


// ========================================
// تشغيل الروبوت
// ========================================

async function startRobot() {

    const speech =
        document.getElementById("speech");

    const camera =
        document.getElementById("camera");

    const loading =
        document.getElementById("loading");

    const button =
        document.getElementById("startButton");


    speechSynthesis.cancel();

    button.disabled = true;


    speech.innerText =
        "لحظة... 👀";

    speak("لحظة");


    try {

        // تشغيل الكاميرا

        const stream =
            await navigator.mediaDevices.getUserMedia({
                video: true,
                audio: false
            });


        camera.srcObject = stream;

        camera.style.display = "block";


        // تحميل الذكاء الاصطناعي

        loading.innerText =
            "🧠 روبو يتعلم كيف يشوف...";


        model =
            await cocoSsd.load();


        loading.innerText = "";


        speech.innerText =
            "جاهز! 🤖";


        speak("جاهز");


        // بدء التعرف

        detectObjects();

    }

    catch (error) {

        console.log(error);


        speech.innerText =
            "ما قدرت أشغل عيوني 😢";


        speak("ما قدرت أشغل عيوني");


        button.disabled = false;
    }
}


// ========================================
// صوت الروبوت
// ========================================

function speak(text) {

    speechSynthesis.cancel();


    const voice =
        new SpeechSynthesisUtterance(text);


    voice.lang = "ar-SA";

    voice.rate = 0.8;

    voice.pitch = 1.1;


    speechSynthesis.speak(voice);
}


// ========================================
// الذكاء الاصطناعي يشوف الكاميرا
// ========================================

async function detectObjects() {

    if (!model) return;


    const camera =
        document.getElementById("camera");


    const predictions =
        await model.detect(camera);


    // ====================================
    // إذا ما شاف شيء
    // ====================================

    if (predictions.length === 0) {

        currentObject = "";

        sameObjectCount = 0;

        requestAnimationFrame(detectObjects);

        return;
    }


    // ====================================
    // نأخذ أعلى نتيجة
    // ====================================

    const object =
        predictions[0];


    const confidence =
        object.score;


    // لازم الثقة تكون 75% أو أكثر
    // رفعناها من 65 إلى 75

    if (confidence < 0.75) {

        requestAnimationFrame(detectObjects);

        return;
    }


    const objectName =
        object.class;


    // ====================================
    // التأكد أن الشيء ثابت
    // ====================================

    if (objectName === currentObject) {

        sameObjectCount++;

    } else {

        currentObject =
            objectName;

        sameObjectCount = 1;
    }


    // ====================================
    // لم يظهر الشيء بما يكفي
    // ====================================

    if (sameObjectCount < REQUIRED_FRAMES) {

        requestAnimationFrame(detectObjects);

        return;
    }


    // ====================================
    // إذا كان نفس الشيء الذي قاله
    // لا يتكلم مرة ثانية
    // ====================================

    if (objectName === lastSpokenObject) {

        requestAnimationFrame(detectObjects);

        return;
    }


    // ====================================
    // شيء جديد!
    // ====================================

    lastSpokenObject =
        objectName;


    const info =
        getObjectInfo(objectName);


    // عرض الاسم فقط

    document.getElementById("result").innerText =
        info.arabic +
        " — " +
        info.english;


    // الكلام فقط:
    // تفاحة - Apple

    const speechText =
        info.arabicClean +
        " — " +
        info.english;


    document.getElementById("speech").innerText =
        speechText;


    speak(speechText);


    requestAnimationFrame(detectObjects);
}


// ========================================
// أسماء الأشياء
// ========================================

function getObjectInfo(object) {

    const names = {

        apple: {
            arabic: "🍎 تفاحة",
            arabicClean: "تفاحة",
            english: "Apple"
        },

        banana: {
            arabic: "🍌 موزة",
            arabicClean: "موزة",
            english: "Banana"
        },

        book: {
            arabic: "📕 كتاب",
            arabicClean: "كتاب",
            english: "Book"
        },

        bottle: {
            arabic: "🍼 قارورة",
            arabicClean: "قارورة",
            english: "Bottle"
        },

        cup: {
            arabic: "🥤 كوب",
            arabicClean: "كوب",
            english: "Cup"
        },

        backpack: {
            arabic: "🎒 شنطة",
            arabicClean: "شنطة",
            english: "Backpack"
        },

        chair: {
            arabic: "🪑 كرسي",
            arabicClean: "كرسي",
            english: "Chair"
        },

        laptop: {
            arabic: "💻 لابتوب",
            arabicClean: "لابتوب",
            english: "Laptop"
        },

        cell_phone: {
            arabic: "📱 جوال",
            arabicClean: "جوال",
            english: "Cell phone"
        },

        teddy_bear: {
            arabic: "🧸 دبدوب",
            arabicClean: "دبدوب",
            english: "Teddy bear"
        },

        cat: {
            arabic: "🐱 قطة",
            arabicClean: "قطة",
            english: "Cat"
        },

        dog: {
            arabic: "🐶 كلب",
            arabicClean: "كلب",
            english: "Dog"
        },

        bicycle: {
            arabic: "🚲 دراجة",
            arabicClean: "دراجة",
            english: "Bicycle"
        },

        car: {
            arabic: "🚗 سيارة",
            arabicClean: "سيارة",
            english: "Car"
        },

        bus: {
            arabic: "🚌 باص",
            arabicClean: "باص",
            english: "Bus"
        },

        bird: {
            arabic: "🐦 طائر",
            arabicClean: "طائر",
            english: "Bird"
        },

        horse: {
            arabic: "🐴 حصان",
            arabicClean: "حصان",
            english: "Horse"
        },

        sheep: {
            arabic: "🐑 خروف",
            arabicClean: "خروف",
            english: "Sheep"
        },

        cow: {
            arabic: "🐮 بقرة",
            arabicClean: "بقرة",
            english: "Cow"
        },

        elephant: {
            arabic: "🐘 فيل",
            arabicClean: "فيل",
            english: "Elephant"
        },

        giraffe: {
            arabic: "🦒 زرافة",
            arabicClean: "زرافة",
            english: "Giraffe"
        }

    };


    return names[object] || {
        arabic: "🤔 شيء",
        arabicClean: "شيء",
        english: "Something"
    };
}

</script>

</body>
</html>
