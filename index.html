<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>روبو يتعلم 🤖</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #dff7ff;
            text-align: center;
            direction: rtl;
        }

        .screen {
            min-height: 100vh;
            padding: 30px 20px;
        }

        h1 {
            font-size: 42px;
            color: #333;
        }

        .robot {
            font-size: 120px;
            margin: 10px;
        }

        .speech {
            background: white;
            display: inline-block;
            padding: 18px 30px;
            border-radius: 25px;
            font-size: 26px;
            margin: 15px;
        }

        button {
            border: none;
            background: #62d4a7;
            padding: 18px 35px;
            border-radius: 25px;
            font-size: 24px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }

        #camera {
            display: none;
            width: 80%;
            max-width: 700px;
            margin: 25px auto;
            border-radius: 30px;
            border: 6px solid white;
        }
    </style>
</head>

<body>

    <div class="screen">

        <h1>🤖 روبو يتعلّم!</h1>

        <div class="robot">
            🤖
        </div>

        <div class="speech" id="speech">
            هلاااا يا أصدقاء! 👋
        </div>

        <br>

        <button onclick="startRobot()">
            👀 شغّلوا عيوني!
        </button>

        <video id="camera" autoplay playsinline></video>

    </div>

    <script>

        async function startRobot() {

            const speech = document.getElementById("speech");
            const camera = document.getElementById("camera");

            speech.innerText = "أوووه! مستعدين؟ 👀🤖";

            const voice = new SpeechSynthesisUtterance(
                "أوووه! مستعدين؟"
            );

            voice.lang = "ar-SA";
            voice.rate = 0.9;

            speechSynthesis.speak(voice);

            try {

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: true,
                    audio: false
                });

                camera.srcObject = stream;
                camera.style.display = "block";

                speech.innerText = "واااو! شغلت عيوني! 👀";

                const voice2 = new SpeechSynthesisUtterance(
                    "واااو! شغلت عيوني!"
                );

                voice2.lang = "ar-SA";
                voice2.rate = 0.9;

                speechSynthesis.speak(voice2);

            } catch (error) {

                speech.innerText =
                    "أوه! ما قدرت أشغل الكاميرا 😢";

                console.log(error);
            }
        }

    </script>

</body>
</html>
